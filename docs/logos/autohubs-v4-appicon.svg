<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 80" width="380" height="80">
  <!-- AutoHubs V4 — Ícone app com fundo sólido -->

  <!-- App icon background -->
  <rect x="0" y="4" width="72" height="72" rx="16" fill="#185FA5"/>

  <!-- Hub central -->
  <circle cx="36" cy="40" r="10" fill="white"/>

  <!-- Nós satélites -->
  <circle cx="36" cy="14" r="5" fill="white" opacity="0.85"/>
  <circle cx="60" cy="55" r="5" fill="white" opacity="0.85"/>
  <circle cx="12" cy="55" r="5" fill="white" opacity="0.85"/>

  <!-- Conexões -->
  <line x1="36" y1="30" x2="36" y2="19" stroke="white" stroke-width="2" opacity="0.7"/>
  <line x1="46" y1="46" x2="55" y2="50" stroke="white" stroke-width="2" opacity="0.7"/>
  <line x1="26" y1="46" x2="17" y2="50" stroke="white" stroke-width="2" opacity="0.7"/>

  <!-- Arco automação -->
  <path d="M 18 22 A 22 22 0 0 1 54 22" fill="none" stroke="white" stroke-width="1.2" stroke-dasharray="3,2" opacity="0.5"/>

  <!-- Wordmark -->
  <text x="90" y="38" font-family="'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="32" font-weight="700" fill="#185FA5" letter-spacing="-0.5">Auto</text>
  <text x="168" y="38" font-family="'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="32" font-weight="300" fill="#378ADD" letter-spacing="-0.5">Hubs</text>

  <!-- Tagline -->
  <text x="92" y="58" font-family="'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="500" fill="#85B7EB" letter-spacing="2.5">PLATAFORMA DE AUTOMAÇÃO</text>
</svg>
